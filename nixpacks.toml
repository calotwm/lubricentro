# Railway deployment config for Lubricentro G&G
# Builds the frontend, then runs the Python backend which serves both API and frontend

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = [
  "cd backend && pip install -r requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd frontend && npx vite build"
]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
