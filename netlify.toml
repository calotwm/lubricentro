[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# Redirigir /api/* al backend en Koyeb
[[redirects]]
  from = "/api/*"
  to = "https://lubricentro-backend.koyeb.app/api/:splat"
  status = 200
  force = true

# SPA: todas las rutas al index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
